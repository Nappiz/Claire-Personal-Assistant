name: Backend structural quality gates
on:
  push:
    paths: ['backend/**', 'REFACTORING_RULES.md', '.github/workflows/backend-refactor.yml']
  pull_request:
    paths: ['backend/**', 'REFACTORING_RULES.md', '.github/workflows/backend-refactor.yml']
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/scripts/check_architecture.py
      - run: python backend/scripts/run_evals.py
      - run: python backend/scripts/run_tests.py
